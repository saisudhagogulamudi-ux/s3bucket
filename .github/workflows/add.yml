name: "Beginner Terraform Workflow"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: write

jobs:
  terraform:
    name: "Execute Terraform"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "ap-south-1"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      # If running destroy, import the bucket automatically if state is empty
      - name: Auto-sync State for Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          # Dynamically extracts the resource name from s3.tf (no hardcoding)
          RES_TYPE=$(grep -oE 'resource "[^"]+"' main1.tf | head -1 | tr -d '"' | awk '{print $2}')
          RES_NAME=$(grep -oE 'resource "[^"]+" "[^"]+"' main1.tf | head -1 | tr -d '"' | awk '{print $3}')
          FULL_ADDR="${RES_TYPE}.${RES_NAME}"
          echo "Target Resource Address: $FULL_ADDR"

          # Check if state already knows about this resource; if not, import it
          if ! terraform state list | grep -q "$FULL_ADDR"; then
            # Find the actual bucket in AWS matching this project
            BUCKET=$(aws s3api list-buckets --query "Buckets[?contains(Name, 'gitops')].Name" --output text | awk '{print $1}')
            if [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ]; then
              echo "Importing existing bucket: $BUCKET into $FULL_ADDR"
              terraform import "$FULL_ADDR" "$BUCKET" || true
            fi
          fi

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false
